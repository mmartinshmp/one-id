<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/hmp-global-design-system-3643566b-7f0f-4773-bf3d-c3d939031955/styles.css">
  <script src="_ds/hmp-global-design-system-3643566b-7f0f-4773-bf3d-c3d939031955/_ds_bundle.js"></script>
  <style>html, body, * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; font-smooth: never; }</style>
</helmet>
<div style="display:flex;flex-direction:column;gap:8px;font-family:var(--font-body);min-width:0">
  <label id="{{ labelId }}" for="{{ id }}" style="font-family:var(--font-body);font-weight:500;font-size:16px;line-height:1.3;color:var(--stone-900);display:flex;gap:1px">{{ label }}<sc-if value="{{ required }}" hint-placeholder-val="{{ false }}"><span aria-hidden="true" style="color:var(--stone-600);font-weight:400">*</span></sc-if></label>
  <sc-if value="{{ helper }}" hint-placeholder-val="{{ false }}"><div id="{{ helperId }}" style="font-size:15px;line-height:1.45;font-weight:500;color:var(--stone-500);margin:2px 0">{{ helper }}</div></sc-if>
  <div style="position:relative" ref="{{ rootRef }}">
    <button id="{{ id }}" type="button" role="combobox" aria-haspopup="listbox" aria-expanded="{{ open }}" aria-controls="{{ listId }}" aria-labelledby="{{ labelId }}" aria-describedby="{{ describedBy }}" aria-invalid="{{ invalid }}" disabled="{{ disabled }}" onClick="{{ toggle }}" onKeyDown="{{ onTriggerKey }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" style="{{ triggerStyle }}">
      <span style="{{ valueStyle }}">{{ display }}</span>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;color:var(--stone-500)"><polyline points="6 9 12 15 18 9"></polyline></svg>
    </button>
    <sc-if value="{{ open }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:40;background:#fff;border:1px solid var(--stone-200);border-radius:6px;box-shadow:var(--shadow-lg);overflow:hidden">
        <sc-if value="{{ searchable }}" hint-placeholder-val="{{ false }}">
          <div style="padding:8px;border-bottom:1px solid var(--stone-200);display:flex;align-items:center;gap:8px">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color:var(--stone-500);flex-shrink:0;margin-left:6px"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
            <input ref="{{ searchRef }}" type="text" role="searchbox" aria-label="Type to filter options" aria-controls="{{ listId }}" value="{{ query }}" onChange="{{ onQuery }}" onKeyDown="{{ onSearchKey }}" placeholder="Type to search…" autocomplete="off" style="flex:1;min-width:0;height:40px;border:0;outline:none;font-family:var(--font-body);font-size:16px;font-weight:500;color:var(--stone-900);background:transparent"></input>
          </div>
        </sc-if>
        <div id="{{ listId }}" role="listbox" aria-labelledby="{{ labelId }}" ref="{{ listRef }}" style="max-height:264px;overflow-y:auto;padding:4px">
          <sc-for list="{{ rows }}" as="o" hint-placeholder-count="0">
            <div role="option" id="{{ o.id }}" data-hi="{{ o.dataHi }}" aria-selected="{{ o.selected }}" onMouseDown="{{ o.pick }}" onMouseEnter="{{ o.hover }}" style="{{ o.style }}">
              <span style="flex:1;min-width:0">{{ o.label }}</span>
              <sc-if value="{{ o.selected }}" hint-placeholder-val="{{ false }}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--stone-500)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"></polyline></svg></sc-if>
            </div>
          </sc-for>
          <sc-if value="{{ noResults }}" hint-placeholder-val="{{ false }}"><div style="padding:12px;font-size:14px;color:var(--stone-500)">No matches for “{{ query }}”</div></sc-if>
        </div>
      </div>
    </sc-if>
  </div>
  <sc-if value="{{ error }}" hint-placeholder-val="{{ false }}">
    <div id="{{ errorId }}" role="alert" style="display:flex;gap:6px;align-items:flex-start;font-size:15px;line-height:1.4;color:var(--destructive);font-weight:600;margin:2px 0">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-top:2px"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="8" x2="12" y2="12"></line><line x1="12" y1="16" x2="12.01" y2="16"></line></svg>
      <span>{{ error }}</span>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:420,&quot;height&quot;:120},&quot;label&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Country&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;options&quot;:{&quot;editor&quot;:null,&quot;default&quot;:[&quot;United States&quot;,&quot;Canada&quot;,&quot;Mexico&quot;],&quot;tsType&quot;:&quot;string[]&quot;},&quot;value&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;onChange&quot;:{&quot;editor&quot;:null,&quot;default&quot;:null,&quot;tsType&quot;:&quot;(v: string) =&gt; void&quot;},&quot;placeholder&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Select…&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;required&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;searchable&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;disabled&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;error&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;helper&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;id&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;sel&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { open: false, query: "", hi: -1, focus: false };
  rootRef = React.createRef();
  searchRef = React.createRef();
  listRef = React.createRef();
  componentDidMount() {
    this._doc = (e) => { if (this.state.open && this.rootRef.current && !this.rootRef.current.contains(e.target)) this.close(); };
    document.addEventListener("mousedown", this._doc);
  }
  componentWillUnmount() { document.removeEventListener("mousedown", this._doc); }
  componentDidUpdate(_, prev) {
    prev = prev || this._prev || {}; this._prev = { open: this.state.open, hi: this.state.hi };
    if (this.state.open && !prev.open && this.props.searchable) requestAnimationFrame(() => this.searchRef.current && this.searchRef.current.focus());
    if (this.state.hi !== prev.hi && this.listRef.current) {
      const el = this.listRef.current.querySelector('[data-hi="1"]');
      if (el) { const l = this.listRef.current; const t = el.offsetTop, b = t + el.offsetHeight; if (t < l.scrollTop) l.scrollTop = t; else if (b > l.scrollTop + l.clientHeight) l.scrollTop = b - l.clientHeight; }
    }
  }
  opts() { return (this.props.options || []).map(o => typeof o === "string" ? { value: o, label: o } : o); }
  filtered() { const q = this.state.query.trim().toLowerCase(); const all = this.opts(); return q ? all.filter(o => o.label.toLowerCase().includes(q)) : all; }
  close() { this.setState({ open: false, query: "", hi: -1 }); }
  openList() { if (this.props.isDisabled) return; const idx = this.opts().findIndex(o => o.value === this.props.value); this.setState({ open: true, query: "", hi: idx }); }
  pick(v) { this.props.onChange && this.props.onChange(v); this.close(); const b = this.rootRef.current && this.rootRef.current.querySelector("button"); if (b) b.focus(); }
  move(d) { const n = this.filtered().length; if (!n) return; this.setState(s => ({ hi: (s.hi + d + n) % n })); }
  key(e) {
    const f = this.filtered();
    if (e.key === "Escape") { e.preventDefault(); this.close(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); this.state.open ? this.move(1) : this.openList(); return; }
    if (e.key === "ArrowUp") { e.preventDefault(); this.state.open ? this.move(-1) : this.openList(); return; }
    if (e.key === "Home" && this.state.open) { e.preventDefault(); this.setState({ hi: 0 }); return; }
    if (e.key === "End" && this.state.open) { e.preventDefault(); this.setState({ hi: f.length - 1 }); return; }
    if (e.key === "Enter" || (e.key === " " && !this.props.searchable)) { e.preventDefault(); if (!this.state.open) this.openList(); else if (f[this.state.hi]) this.pick(f[this.state.hi].value); return; }
    if (e.key === "Tab" && this.state.open) this.close();
    if (!this.props.searchable && this.state.open && e.key.length === 1) { const q = e.key.toLowerCase(); const i = this.opts().findIndex(o => o.label.toLowerCase().startsWith(q)); if (i >= 0) this.setState({ hi: i }); }
  }
  renderVals() {
    const p = this.props, s = this.state;
    const id = p.fieldId || "sel", all = this.opts(), cur = all.find(o => o.value === p.selected);
    const dis = !!p.isDisabled, err = !!p.errorText;
    const border = err ? "var(--destructive)" : (s.open || s.focus) ? "var(--brand)" : "var(--stone-400)";
    const f = this.filtered();
    return {
      id, labelId: id + "-label", listId: id + "-list", helperId: id + "-help", errorId: id + "-err",
      describedBy: [p.helper ? id + "-help" : null, p.errorText ? id + "-err" : null].filter(Boolean).join(" ") || undefined,
      label: p.label, required: !!p.required, helper: p.helper, error: p.errorText, invalid: err ? "true" : undefined,
      disabled: dis, open: s.open, searchable: !!p.searchable, query: s.query, noResults: s.open && f.length === 0,
      display: cur ? cur.label : (p.placeholder || "Select…"),
      rootRef: this.rootRef, searchRef: this.searchRef, listRef: this.listRef,
      triggerStyle: { width: "100%", height: 46, boxSizing: "border-box", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 8, padding: "0 14px 0 16px", borderRadius: 6, border: "1px solid " + border, background: dis ? "var(--stone-50)" : "#fff", cursor: dis ? "not-allowed" : "pointer", textAlign: "left", fontFamily: "var(--font-body)", fontSize: 16, fontWeight: 500, color: dis ? "var(--stone-500)" : "var(--stone-900)", outline: "none", boxShadow: s.focus && !dis ? "0 0 0 3px color-mix(in oklab, var(--brand) 35%, transparent)" : "none", transition: "box-shadow .15s ease, border-color .15s ease", opacity: dis ? 0.7 : 1 },
      valueStyle: { flex: 1, minWidth: 0, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap", color: cur ? "inherit" : "var(--stone-500)" },

        pick: (e) => { e.preventDefault(); this.pick(o.value); }, hover: () => this.setState({ hi: i }),
        style: { display: "flex", alignItems: "center", gap: 8, minHeight: 44, padding: "0 12px", borderRadius: 6, fontSize: 16, cursor: "pointer", color: "var(--stone-900)", fontWeight: o.value === p.selected ? 600 : 500, background: i === s.hi ? "var(--stone-100)" : "transparent" } })),
      toggle: () => s.open ? this.close() : this.openList(),
      onTriggerKey: (e) => this.key(e), onSearchKey: (e) => this.key(e),

  }
}
</script>
</body>
</html>
